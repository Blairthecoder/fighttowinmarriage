# Static site: HTML is generated by build.py and committed in site/.
[build]
  publish = "site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/coaching"
  to = "/marriage-coaching/"
  status = 301
[[redirects]]
  from = "/tuesday"
  to = "/tuesday-prayer-call/"
  status = 301
[[redirects]]
  from = "/book"
  to = "/contact/"
  status = 301
