# Posts in content/ carry future publish dates. build.py only renders posts dated on or before
# the build date, so this job rebuilds daily and commits when a post comes due.
name: Publish scheduled posts
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 build.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add site
            git commit -m "Publish scheduled posts"
            git push
          fi
